name: deploy to hugging face

# Mirrors the repository to a Hugging Face Space on merge to main, so the
# interactive explorer stays in sync with the canonical GitHub repository.
# GitHub is the source of truth; the Space is a deployment target.
#
# Setup required once, by the repository owner:
#   1. Create a Streamlit Space at huggingface.co/new-space
#   2. Add a repository secret HF_TOKEN (a Hugging Face write token)
#   3. Set HF_USERNAME and HF_SPACE below to match the Space
#
# Until those are set the job is skipped, so it never fails a normal push.

on:
  push:
    branches: [main]

env:
  HF_USERNAME: your-hf-username
  HF_SPACE: ai-reinvention-benchmark

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            main:main

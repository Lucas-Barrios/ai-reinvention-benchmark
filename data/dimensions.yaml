# Assessment framework: dimensions, weights and anchored scoring descriptors
#
# Adopted before any company was assessed. See CHARTER.md, "Integrity commitments".
# Amendments to this file after assessment has begun must be justified in
# METHODOLOGY.md and are visible in git history.
#
# v1.2 amends the scope of assessment after a framework ambiguity was exposed
# during source review. Amended before any company was scored. See
# METHODOLOGY.md section 9.

version: "1.2"
adopted: 2026-08-12
amended: 2026-08-12

scale:
  min: 0
  max: 5
  measures: >
    Evidence of public disclosure, not internal capability. A company scoring low
    may be doing excellent work it has chosen not to publish. Every score in this
    project is a statement about what a company has published.
  ladder: >
    Each level describes a threshold of evidence, not a degree of enthusiasm. The
    generic ladder below governs every dimension; the per-dimension anchors
    instantiate it in the language of that dimension. Where evidence is ambiguous
    between two levels, the lower level is recorded and the ambiguity noted in the
    assessment file.
  generic_levels:
    0: No public evidence.
    1: Stated intent. Strategy language or executive statement, no named initiative.
    2: Named initiative at pilot, proof-of-concept or single-site scope.
    3: Production deployment within a defined and disclosed scope.
    4: Production at scale across the group, with supporting structure disclosed.
    5: Production at scale with quantified outcomes published.

scope_rule:
  principle: >
    This benchmark assesses each company as an ADOPTER of AI in its own
    operations. It does not assess the company as a VENDOR of AI to others.
    Several firms in the peer set sell industrial automation and AI software.
    Without this rule, those firms would score highly for their product
    portfolios and the benchmark would become a catalogue of who sells AI rather
    than an assessment of who runs on it.
  rules:
    - Products and services the company sells count as evidence only where the
      company discloses deploying them in its own operations.
    - Customer case studies and customer outcomes are not evidence of the
      assessed company's own maturity, however impressive.
    - Where a company states it uses its own technology internally, that counts,
      and the evidence entry records it explicitly.
  exception:
    dimension: governance_readiness
    reason: >
      Governance structures count whether they cover the company's own use of AI
      or the AI it places on the market. Under the EU AI Act obligations attach
      to providers and deployers alike, and in practice firms operate one
      governance structure across both. Each evidence entry records which it
      covers.

weighting_principle: >
  Weights express a view about what most separates leaders from followers in
  European industrial machinery today. They are a judgement, documented and
  argued in METHODOLOGY.md, and the published explorer allows any reader to
  substitute their own. Weights sum to 1.00.

dimensions:

  - id: data_foundation
    name: Data foundation
    weight: 0.20
    definition: >
      The degree to which the company has consolidated, integrated and governed
      its own data estate. Covers platform consolidation, integration of
      operational and enterprise data, data quality practice, and named
      stewardship of data assets. Data platforms the company sells to customers
      are out of scope unless it discloses running its own operations on them.
    why_it_matters: >
      Agentic and generative systems fail quietly on fragmented data. Sector
      firms carry decades of plant, product and service data across
      incompatible systems, which makes this the constraint that most often
      determines whether anything else is possible.
    evidence_sources:
      - Annual and integrated reports, technology and digitalisation sections
      - Disclosed IT or data platform programmes
      - Platform and cloud partnership announcements
      - Interviews with named CIO, CDO or equivalent
    anchors:
      0: No public reference to data platform work, data integration or data governance.
      1: Data described as a strategic priority, with no named platform, programme or owner.
      2: A named data platform or integration programme is disclosed, at pilot or single-site scope.
      3: A consolidated data platform is in production for at least one business area or plant network.
      4: Group-wide data platform in production, with data governance roles or standards disclosed.
      5: Group-wide platform in production with governance disclosed and published measures of data coverage, quality or adoption.

  - id: process_automation_depth
    name: Process automation depth
    weight: 0.15
    definition: >
      How far automation extends into core operating processes, as distinct from
      the automation the company sells to customers. Covers manufacturing,
      supply chain, aftersales and back-office processes.
    why_it_matters: >
      Machinery firms automate for their customers. Whether they have automated
      their own operating processes to the same standard is a different question,
      and the answer indicates how prepared they are to absorb AI into workflow
      rather than bolt it on.
    evidence_sources:
      - Annual report operations and efficiency sections
      - Disclosed internal transformation or excellence programmes
      - Shared service and back-office announcements
      - Careers pages describing internal process roles
    anchors:
      0: No public reference to automation of the company's own operating processes.
      1: Internal automation named as an ambition, with no process identified.
      2: Automation deployed in a named internal process at pilot or single-site scale.
      3: Automation in production in at least one core process across multiple sites.
      4: Automation embedded across several core processes, with process ownership or a transformation programme disclosed.
      5: As level 4, with published quantified effect on cycle time, cost, throughput or headcount redeployment.

  - id: agentic_genai_deployment
    name: Agentic and generative AI deployment
    weight: 0.25
    definition: >
      Production use of generative and agentic AI inside the company's own
      operations, distinguished from pilots, demonstrations and vendor
      partnership announcements. Production means real internal users, real
      workload, in a named business context. Generative AI the company sells is
      out of scope unless it discloses deploying it in its own operations. See
      scope_rule.
    why_it_matters: >
      This is the reinvention frontier and the dimension where the distance
      between announcement and deployment is widest. Weighted highest because it
      most sharply separates firms that have operationalised the technology from
      firms that have discussed it. Several peers sell generative AI products;
      whether they run on them is a different and more revealing question.
    evidence_sources:
      - Press releases naming applications in production
      - Annual report AI sections
      - Product and platform announcements
      - Technical blogs and conference presentations by named employees
    anchors:
      0: No public reference to generative or agentic AI in the company's own operations.
      1: Internal use of generative AI named in strategy or an executive statement, with no application identified.
      2: Named internal pilot or proof of concept, with no disclosed production use.
      3: At least one generative AI application in production with real internal users in a named business function.
      4: Multiple generative AI applications in internal production, or a disclosed agentic workflow acting across process steps.
      5: As level 4, with published internal adoption or outcome figures and a described human oversight model.

  - id: governance_readiness
    name: AI governance readiness
    weight: 0.15
    definition: >
      Disclosed structures for governing AI: published policies or principles,
      accountable roles or bodies, risk classification practice, EU AI Act
      preparation, and human oversight requirements.
    why_it_matters: >
      For EU manufacturers the AI Act converts governance from a reputational
      question into a compliance one. Firms that have disclosed structure are
      better placed to deploy into regulated and safety-relevant processes,
      which is where much of the sector value sits.
    evidence_sources:
      - Published AI policies, principles or position papers
      - Sustainability and non-financial reports, governance sections
      - Compliance and risk management disclosures
      - Regulatory consultation responses
    anchors:
      0: No public reference to AI governance, policy or principles.
      1: General responsible AI or ethics statement, with no structure, owner or process named.
      2: AI principles published, or AI referenced within an existing risk or compliance framework.
      3: A named governance body, policy or accountable role for AI is disclosed.
      4: Governance structure disclosed together with risk classification practice or explicit EU AI Act preparation.
      5: As level 4, with human oversight requirements disclosed and evidence of governance applied to named systems.

  - id: workforce_enablement
    name: Workforce enablement
    weight: 0.10
    definition: >
      Programmes to build AI capability in the workforce: training, literacy
      initiatives, role redesign, internal expert communities, and dedicated
      internal capability.
    why_it_matters: >
      Adoption, not procurement, is the usual failure point. Weighted lowest not
      because it matters least in practice but because public disclosure on it is
      the least comparable across firms, so the evidence supports fewer
      distinctions.
    evidence_sources:
      - Sustainability and people reports, training sections
      - Careers pages and employer branding material
      - Announced academy, upskilling or partnership programmes
      - Works council and employee representative statements
    anchors:
      0: No public reference to AI skills or training.
      1: Upskilling mentioned in general terms, without AI specificity.
      2: AI training offered to a specific group, such as engineering or IT.
      3: Structured AI enablement programme disclosed for a broad employee population.
      4: Group-wide programme with participation scale or dedicated internal capability disclosed.
      5: As level 4, with published participation figures and evidence of resulting role or process change.

  - id: disclosed_outcomes
    name: Disclosed measurable outcomes
    weight: 0.15
    definition: >
      Whether the company publishes quantified results from AI work in its own
      operations: figures with scope, baseline or method, rather than intentions,
      activity or adjectives. Results achieved by customers using the company's
      products are out of scope. See scope_rule.
    why_it_matters: >
      Publishing a number is the clearest signal available from outside that a
      deployment is real and measured. It is also the discipline most absent from
      sector communication, which makes it discriminating.
    evidence_sources:
      - Annual report performance sections
      - Capital markets day and investor presentations
      - Case studies with named figures
      - Press releases quantifying results rather than intent
    anchors:
      0: No outcomes published.
      1: Qualitative benefit claims only, such as improved efficiency, with no figure.
      2: A single quantified figure for one initiative, without stated scope, baseline or method.
      3: Quantified outcomes for at least one initiative with scope described.
      4: Quantified outcomes across multiple initiatives, or a disclosed group-level AI value target with progress reported.
      5: As level 4, with baseline, method or independent verification disclosed.
